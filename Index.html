<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COVID-19 Tracker Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">🌍 COVID-19 Tracker Dashboard</h1>

    <!-- Global Summary -->
    <div id="globalSummary" class="card p-3 text-center mb-4 bg-warning bg-opacity-10">
      <h4>🌎 Global Summary</h4>
      <div class="row mt-3">
        <div class="col-md-4"><strong>Total Cases:</strong> <span id="globalCases">-</span></div>
        <div class="col-md-4"><strong>Total Recovered:</strong> <span id="globalRecovered">-</span></div>
        <div class="col-md-4"><strong>Total Deaths:</strong> <span id="globalDeaths">-</span></div>
      </div>
      <p class="text-muted mt-2" id="lastUpdated"></p>
    </div>

    <!-- Country Dropdown -->
    <div class="text-center mb-4">
      <select id="countrySelect" class="form-select w-auto d-inline-block">
        <option value="">Select a country</option>
      </select>
      <button id="searchBtn" class="btn btn-primary ms-2">Show Data</button>
    </div>

    <!-- Country Stats -->
    <div id="statsCard" class="card p-3 d-none">
      <h3 id="countryName" class="text-center mb-3"></h3>
      <div class="row text-center">
        <div class="col-md-4">
          <h5>Confirmed</h5>
          <p id="confirmed" class="fs-4 text-warning fw-bold"></p>
        </div>
        <div class="col-md-4">
          <h5>Recovered</h5>
          <p id="recovered" class="fs-4 text-success fw-bold"></p>
        </div>
        <div class="col-md-4">
          <h5>Deaths</h5>
          <p id="deaths" class="fs-4 text-danger fw-bold"></p>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <canvas id="covidChart"></canvas>
    </div>

    <div id="error" class="alert alert-danger mt-3 d-none"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
